[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ptcg-ai-portfolio"
version = "0.1.0"
description = "Recurrent game policies, PPO and legal hidden-state inference: source-only portfolio"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
review = ["numpy>=1.26", "torch>=2.6,<3", "pytest>=8", "scikit-learn>=1.4"]
native = ["kaggle-environments==1.32.7"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests/review"]
pythonpath = ["src", "scripts", "."]
